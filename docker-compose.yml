services:
  catalog:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      ENABLE_ADMIN: ${ENABLE_ADMIN:-false}
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "3001"
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:3000"
      - "127.0.0.1:${ADMIN_PORT:-8081}:3001"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
